# cargo-deny policy for Aipo. Checked in CI tier "scheduled" (`cargo deny check`).
# Workspace license is MIT; dependencies must be compatible.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    { name = "bitflags" },
    { name = "block-buffer" },
    { name = "cpufeatures" },
    { name = "crypto-common" },
    { name = "digest" },
    { name = "foldhash" },
    { name = "hashbrown" },
    { name = "itertools" },
    { name = "miniz_oxide" },
    { name = "sha2" },
    { name = "smallvec" },
    { name = "syn" },
]
skip-tree = [
    { name = "aipo-game-host" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
    "RUSTSEC-2025-0035",
    "RUSTSEC-2026-0192",
]

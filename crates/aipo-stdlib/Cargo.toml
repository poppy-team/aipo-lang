[package]
name = "aipo-stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Canonical standard library and Prelude V1 for Aipo"
publish = false

[lints]
workspace = true

[dependencies]
aipo-diagnostics = { path = "../aipo-diagnostics" }
aipo-host = { path = "../aipo-host" }
aipo-runtime = { path = "../aipo-runtime" }
aipo-vm = { path = "../aipo-vm" }
serde = { workspace = true }
serde_json = { workspace = true }
# Canon-preferred Unicode providers (see docs/canon/Aipo — Stdlib V1 …: segmentation + NFC).
unicode-normalization = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
regex = { workspace = true, optional = true }

[features]
default = ["regex", "unicode"]
regex = ["dep:regex"]
unicode = ["dep:unicode-normalization", "dep:unicode-segmentation"]

[dev-dependencies]
aipo-bytecode = { path = "../aipo-bytecode" }

[package]
name = "aipo-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Benchmark runner for Aipo: frontend stages, VM workloads, JS backend, scaling analysis"
publish = false

[[bin]]
name = "aipo-bench"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aipo-source = { path = "../aipo-source" }
aipo-lexer = { path = "../aipo-lexer" }
aipo-syntax = { path = "../aipo-syntax" }
aipo-hir = { path = "../aipo-hir" }
aipo-sema = { path = "../aipo-sema" }
aipo-ir = { path = "../aipo-ir" }
aipo-bytecode = { path = "../aipo-bytecode" }
aipo-formatter = { path = "../aipo-formatter" }
aipo-js = { path = "../aipo-js" }
aipo-testkit = { path = "../aipo-testkit" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

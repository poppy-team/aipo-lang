[package]
name = "aipo-cli"
description = "Command-line interface for the Aipo programming language"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "aipo"
path = "src/main.rs"

[dependencies]
aipo-bytecode = { path = "../aipo-bytecode" }
aipo-diagnostics = { path = "../aipo-diagnostics" }
aipo-formatter = { path = "../aipo-formatter" }
aipo-hir = { path = "../aipo-hir" }
aipo-host = { path = "../aipo-host" }
aipo-ir = { path = "../aipo-ir" }
aipo-js = { path = "../aipo-js" }
aipo-package = { path = "../aipo-package" }
aipo-runtime = { path = "../aipo-runtime" }
aipo-sema = { path = "../aipo-sema" }
aipo-source = { path = "../aipo-source" }
aipo-stdlib = { path = "../aipo-stdlib" }
aipo-syntax = { path = "../aipo-syntax" }
aipo-vm = { path = "../aipo-vm" }
aipo-wasm = { path = "../aipo-wasm", default-features = false }

[dev-dependencies]
aipo-testkit = { path = "../aipo-testkit" }
aipo-lexer = { path = "../aipo-lexer" }

[features]
default = ["wasmtime-runner"]
github-http = ["aipo-package/http"]
wasmtime-runner = ["aipo-wasm/wasmtime"]

[lints]
workspace = true
